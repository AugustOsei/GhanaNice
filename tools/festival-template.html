<!doctype html>
<!-- Template for one festival page. Generated by tools/build_festivals.mjs from tools/festivals/<slug>.json:
     edit this file or the data, then run node tools/build_festivals.mjs. Paths are root-relative. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{metaTitle}}</title>
  <meta name="description" content="{{metaDescription}}">
{{robots}}  <link rel="canonical" href="{{url}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="GhanaNice">
  <meta property="og:title" content="{{ogTitle}}">
  <meta property="og:description" content="{{metaDescription}}">
{{ogImage}}  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css?v=58">
  <link rel="stylesheet" href="{{base}}festival.css?v=1">
  <!-- Google Analytics (analytics.js); a browser can turn it off on /privacy/. -->
  <script src="/analytics.js?v=1"></script>
  <!-- Servadot chat assistant; what it collects is on /privacy/. -->
  <script src="https://servadotapp.lovable.app/embed.js" data-assistant="23aebddcc78f79ac5617b5f17fba4251f0ba" async></script>
  <script type="application/ld+json">
{{jsonld}}
  </script>
</head>
<body class="info-page fest-page">
  <a class="skip-link" href="#main">Skip to the page</a>
  <nav class="nav" aria-label="Primary navigation">
    <a class="wordmark" href="/" aria-label="GhanaNice home">Ghana<span>Nice</span><i>★</i></a>
    <p class="nav-place">For locals and visitors alike <span>05°33′N</span></p>
    <div class="nav-links" id="nav-links">
      <a href="/#regions">Regions</a>
      <a href="{{base}}" aria-current="page">Festivals</a>
      <a href="/travel-directory.html">Travel directory</a>
      <a class="nav-share" href="/#tip">Share a nice place</a>
    </div>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="nav-links"><span></span><span></span><b class="sr-only">Menu</b></button>
  </nav>

  <main id="main">
{{hero}}

{{facts}}

    <div class="article{{articleClass}}">
      <article>
{{sections}}
      </article>
{{aside}}
    </div>

{{more}}

    <section class="nl-band" aria-label="Newsletter sign-up" data-newsletter="festival"></section>
  </main>

{{footer}}

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="cut" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="grow"/>
      <feFlood flood-color="#fbf9f3"/><feComposite in2="grow" operator="in" result="edge"/>
      <feMerge><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </svg>
  <script src="/config.js?v=6"></script>
  <script src="/page.js?v=1" defer></script>
  <script src="/footer.js?v=3" defer></script>
  <script src="/newsletter.js?v=2" defer></script>
</body>
</html>
